<div class="mongabay-embed" style="margin:40px 0;"><iframe id="mongabay-2026-089" src="https://monga2026089aaindiadsf1graph.vercel.app/" title="Few takers for India’s deep-sea fishing scheme: boats and funds sanctioned by state (interactive)" width="100%" height="1256" loading="lazy" style="display:block;width:100%;height:1256px;border:0;"></iframe><script>
(function () {
  var frame = document.getElementById("mongabay-2026-089");
  var origin = "https://monga2026089aaindiadsf1graph.vercel.app";
  window.addEventListener("message", function (e) {
    if (e.origin !== origin || e.source !== frame.contentWindow) return;
    if (e.data && e.data.type === "mongabay-embed-height" && e.data.height > 0) {
      frame.style.height = Math.ceil(e.data.height) + "px";
    }
  });
  frame.addEventListener("load", function () {
    frame.contentWindow.postMessage({ type: "mongabay-embed-height-request" }, origin);
  });
})();
</script></div>
